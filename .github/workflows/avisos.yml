# Cada hora le pide a LIFE OS (en Vercel) que envíe los avisos de esa hora.
# Necesita dos secretos del repositorio: APP_URL (p. ej. https://tu-app.vercel.app) y CRON_SECRET
# (el mismo valor configurado en Vercel). Sin ellos, el flujo no hace nada.
name: Avisos LIFE OS

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  enviar:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      APP_URL: ${{ secrets.APP_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Enviar avisos de esta hora
        if: env.APP_URL != '' && env.CRON_SECRET != ''
        run: curl -fsS --max-time 60 -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/avisos/enviar"
