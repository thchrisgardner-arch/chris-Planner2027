<!doctype html>
<html lang="es-CO">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:" />
    <title>LIFE for LIFE · Sin conexión</title>
    <style>
      :root { color-scheme: light; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f4f2; color: #0a0a0a;
        font: 15px/1.5 "Segoe UI", system-ui, sans-serif; }
      main { text-align: center; padding: 24px; max-width: 360px; }
      h1 { font-size: 22px; margin: 16px 0 6px; }
      p { color: #5c5c5c; margin: 0 0 20px; }
      button { font: inherit; font-weight: 600; border: 0; border-radius: 999px; padding: 12px 22px; background: #0a0a0a; color: #fff; cursor: pointer; }
      button:focus-visible { outline: 3px solid #5ce65c; outline-offset: 3px; }
      svg { width: 96px; height: 78px; }
    </style>
  </head>
  <body>
    <main>
      <svg viewBox="28 38 144 116" aria-hidden="true">
        <circle cx="62" cy="62" r="17" fill="#ffd84d"/><circle cx="138" cy="62" r="17" fill="#ffd84d"/>
        <circle cx="62" cy="62" r="8" fill="#f2dc8c"/><circle cx="138" cy="62" r="8" fill="#f2dc8c"/>
        <rect x="34" y="60" width="132" height="92" rx="46" fill="#e8b820"/>
        <rect x="34" y="56" width="132" height="90" rx="45" fill="#ffd84d"/>
        <ellipse cx="57" cy="122" rx="16" ry="12" fill="#fff1b8"/><ellipse cx="143" cy="122" rx="16" ry="12" fill="#fff1b8"/>
        <path d="M68 98 Q80 90 92 98" fill="none" stroke="#0a0a0a" stroke-width="4.2" stroke-linecap="round"/>
        <path d="M108 98 Q120 90 132 98" fill="none" stroke="#0a0a0a" stroke-width="4.2" stroke-linecap="round"/>
        <path d="M95 111 Q100 107 105 111 Q103 116 100 117 Q97 116 95 111 Z" fill="#cfc2a6"/>
        <path d="M92 128 Q100 122 108 128" fill="none" stroke="#0a0a0a" stroke-width="4.2" stroke-linecap="round"/>
      </svg>
      <h1>Sin conexión</h1>
      <p>LIFE for LIFE necesita internet para abrir. Revisa tu conexión y vuelve a intentarlo.</p>
      <button id="reintentar" autofocus>Reintentar</button>
    </main>
    <script>
      const volver = new URLSearchParams(location.search).get("volver") || "https://chris-planner2027.vercel.app";
      const ir = () => { location.href = volver; };
      document.getElementById("reintentar").addEventListener("click", ir);
      window.addEventListener("online", ir);
    </script>
  </body>
</html>
